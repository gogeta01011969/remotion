name: Linux verification
on:
  push:
    branches-ignore: [automation-state]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      RENDER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - run: npm ci
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/rembg
          key: rembg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements-linux.txt') }}
      - run: bash scripts/ci/setup-linux.sh
      - run: npm run typecheck && npm test
      - name: CPU foreground extraction smoke test
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Render an offline comparison (no API credentials)
        run: npm run compare:examples -- --only wingspan
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: linux-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/shorts/suite-wingspan-comparison/
            out/comparisons/suite-wingspan-comparison/
          retention-days: 7
          if-no-files-found: warn
